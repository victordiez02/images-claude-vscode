# Prueba el mod y el instalador en una máquina Windows de GitHub, con Windows PowerShell 5.1 como en cualquier Windows 10 u 11.
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Validar el mod y pasar sus tests
        run: |
          claude plugin validate .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          claude plugin test plugins/images-claude-vscode
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Reducir imágenes con reducir.ps1
        run: .\.github\pruebas\probar-reducir.ps1

      - name: Instalar con instalar.ps1
        run: .\.github\pruebas\probar-instalador.ps1
